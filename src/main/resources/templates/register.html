<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    

<head>
    <title>User Registration</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#registerForm').on('submit', function(event) {
                let username = $('#username').val();
                let password = $('#password').val();
                let fullname = $('#fullname').val();
                let Address = $('#Address').val();
                let branchId = $('#branchId').val();
                if (username === '' || password === '' || fullname===''|| Address===''|| branchId==='') {
                    event.preventDefault();
                    alert('Please fill in all fields.');
                }
            });
        });
    </script>
</head>
<body class="container my-5">
    <h1 class="mb-4">User Registration</h1>
    <form id="registerForm" th:action="@{/api/users/register}" method="post">
        <div class="form-group">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" />
        </div>
        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" />
        </div>
        <div class="form-group">
            <label for="fullname">Fullname:</label>
            <input type="text" id="fullname" name="fullname" class="form-control" placeholder="Enter your fullname" />
        </div>
        <div class="form-group">
            <label for="Address">Address:</label>
            <input type="text" id="Address" name="Address" class="form-control" placeholder="Enter your Address" />
        </div>
        <div class="input-group mb-3">
            <label class="input-group-text" for="branchId">BranchId</label>
            <select class="form-select" id="branchId" name="branchId" aria-placeholder="enter your branchId">
              <option selected>Choose...</option>
              <option value="1">00001</option>
              <option value="2">00002</option>
              <option value="3">00003</option>
            </select>
          </div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
</body>
</html>
